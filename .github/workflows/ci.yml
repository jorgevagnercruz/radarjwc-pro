name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'sync/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar sintaxe das funções
        run: |
          find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validar arquivos essenciais
        run: |
          test -f index.html
          test -f vercel.json
          test -f db/schema.sql
